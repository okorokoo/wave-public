[project]
name = "auth_service"
version = "0.1.0"
description = ""
authors = [
    {name = "okoroko",email = "okorokov.alexei2014@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "alembic (>=1.18.4,<2.0.0)",
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.43.0,<0.44.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-multipart (>=0.0.26,<0.0.27)",
    "aio-pika (>=9.6.2,<10.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "yookassa (>=3.11.0,<4.0.0)",
    "prometheus-fastapi-instrumentator (>=0.9.0)"
]


[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
