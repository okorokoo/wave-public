resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    client_max_body_size 100M;

    # Frontend SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Auth service: документация
    location ~ ^/auth/(docs|redoc|openapi\.json)$ {
        set $auth_docs_upstream auth-service:8000;
        proxy_pass          http://$auth_docs_upstream/$1;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
    }

    # Auth service: /auth/v1/login, /auth/v1/register, ...
    location /auth/ {
        set $auth_upstream auth-service:8000;
        rewrite             ^/auth/(.*)$ /$1 break;
        proxy_pass          http://$auth_upstream;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
    }

    # User service: документация
    location ~ ^/users/(docs|redoc|openapi\.json)$ {
        set $users_docs_upstream user-service:8000;
        proxy_pass          http://$users_docs_upstream/$1;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
    }

    # User service: /users/v1/me, /users/v1/profiles, ...
    location /users/ {
        set $users_upstream user-service:8000;
        rewrite             ^/users/(.*)$ /$1 break;
        proxy_pass          http://$users_upstream;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
    }

    # Beat service: документация (должна быть выше общего /beats/)
    location ~ ^/beats/(docs|redoc|openapi\.json)$ {
        set $beats_upstream beat-service:8000;
        proxy_pass          http://$beats_upstream/$1;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
    }

    # Beat service: /beats/, /beats/{id}/purchase, ...
    location /beats/ {
        set $beats_upstream beat-service:8000;
        rewrite             ^/beats/(.*)$ /$1 break;
        proxy_pass          http://$beats_upstream;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
        proxy_read_timeout  120s;
    }
}
