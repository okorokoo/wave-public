version: '3.8'

services:
  auth-db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "${AUTH_DB_PORT_OUTSIDE}:${DB_PORT_INSIDE}"


  auth-service:
    build:
      context: .
      dockerfile: auth/Dockerfile
    env_file:
      - .env
    depends_on:
      - auth-db
      - rabbitmq
    ports:
      - "8000:8000"


  user-db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "${USER_DB_PORT_OUTSIDE}:${DB_PORT_INSIDE}"


  user-service:
    build:
      context: .
      dockerfile: user/Dockerfile
    env_file:
      - .env
    depends_on:
      - user-db
      - rabbitmq
    ports:
      - "8001:8000"


  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"   # Порт для протокола AMQP
      - "${RABBITMQ_PORT_ADMIN}:${RABBITMQ_PORT_ADMIN}" # Порт для веб-интерфейса управления (логин/пароль: guest/guest)
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
