version: '3.8'

services:
  auth-db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "${AUTH_DB_PORT_OUTSIDE}:${DB_PORT_INSIDE}"


  auth-service:
    build:
      context: ./backend
      dockerfile: auth/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      promtail:
        condition: service_healthy


  user-db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "${USER_DB_PORT_OUTSIDE}:${DB_PORT_INSIDE}"


  user-service:
    build:
      context: ./backend
      dockerfile: user/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      promtail:
        condition: service_healthy


  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"   # Порт для протокола AMQP
      - "${RABBITMQ_PORT_ADMIN}:${RABBITMQ_PORT_ADMIN}" # Порт для веб-интерфейса управления (логин/пароль: guest/guest)
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  beat-db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${BEAT_DB_NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "${BEAT_DB_PORT_OUTSIDE}:${DB_PORT_INSIDE}"


  beat-service:
    build:
      context: ./backend
      dockerfile: beat/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      beat-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      promtail:
        condition: service_healthy

  beat-worker:
    build:
      context: ./backend
      dockerfile: beat/Dockerfile
    command: python worker.py
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      beat-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      promtail:
        condition: service_healthy
    volumes:
      - ./backend/beat/assets:/beat/assets


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - user-service
      - beat-service


  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1026:1025"   # SMTP для сервисов (хост→контейнер; 1025 зарезервирован Hyper-V)
      - "8025:8025"   # Веб-интерфейс: http://localhost:8025


  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # Порт для кода (API)
      - "9001:9001" # Порт для тебя (Браузер / Консоль)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - ./aws/minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5


  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped


  loki:
    image: grafana/loki:2.9.8
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  promtail:
    image: grafana/promtail:2.9.8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "4000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped


volumes:
  prometheus_data:
  loki_data:
  grafana_data:
