version: '3.8'

services:
  auth-db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "${AUTH_DB_PORT_OUTSIDE}:${DB_PORT_INSIDE}"


  auth-service:
    build:
      context: .
      dockerfile: auth/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy


  user-db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "${USER_DB_PORT_OUTSIDE}:${DB_PORT_INSIDE}"


  user-service:
    build:
      context: .
      dockerfile: user/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy


  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"   # Порт для протокола AMQP
      - "${RABBITMQ_PORT_ADMIN}:${RABBITMQ_PORT_ADMIN}" # Порт для веб-интерфейса управления (логин/пароль: guest/guest)
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  beat-db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${BEAT_DB_NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "${BEAT_DB_PORT_OUTSIDE}:${DB_PORT_INSIDE}"


  beat-service:
    build:
      context: .
      dockerfile: beat/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      beat-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  beat-worker:
    build:
      context: .
      dockerfile: beat/Dockerfile
    command: python worker.py
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      beat-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./beat/assets:/beat/assets


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - auth-service
      - user-service
      - beat-service


  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP для сервисов
      - "8025:8025"   # Веб-интерфейс: http://localhost:8025


  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # Порт для кода (API)
      - "9001:9001" # Порт для тебя (Браузер / Консоль)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - ./aws/minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
