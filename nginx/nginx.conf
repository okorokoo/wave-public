upstream auth {
    server auth-service:8000;
}

upstream users {
    server user-service:8000;
}

upstream beats {
    server beat-service:8000;
}

server {
    listen 80;

    # Лимит на размер тела запроса (для загрузки WAV-файлов)
    client_max_body_size 100M;

    # Auth service: /auth/v1/login, /auth/v1/register, ...
    location /auth/ {
        proxy_pass          http://auth/;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
    }

    # User service: /users/v1/me, /users/v1/profiles, ...
    location /users/ {
        proxy_pass          http://users/;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
    }

    # Beat service: документация (должна быть выше общего /beats/)
    location ~ ^/beats/(docs|redoc|openapi\.json)$ {
        proxy_pass          http://beats/$1;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
    }

    # Beat service: /beats/, /beats/{id}/purchase, ...
    location /beats/ {
        proxy_pass          http://beats;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
        proxy_read_timeout  120s;
    }
}
