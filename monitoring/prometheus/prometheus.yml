global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: auth-service
    static_configs:
      - targets: ['auth-service:8000']

  - job_name: user-service
    static_configs:
      - targets: ['user-service:8000']

  - job_name: beat-service
    static_configs:
      - targets: ['beat-service:8000']
