# Dev-инструменты монорепозитория (линтер, типы, pre-commit).
# Зависимости самих сервисов — в backend/<service>/pyproject.toml.

[project]
name = "wave"
version = "0.1.0"
description = "Wave — маркетплейс битов на микросервисах (FastAPI, PostgreSQL, RabbitMQ, S3)"
requires-python = ">=3.12,<4.0"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pre-commit>=4.0",
]

# --- ruff ---------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 120
# Каждый сервис — отдельный корень импортов (app, config, schemas)
src = ["backend/auth", "backend/beat", "backend/user"]
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # блокирующие вызовы в async-коде
]
ignore = [
    "B008",     # Depends()/Query() в дефолтах аргументов — штатный паттерн FastAPI
]

[tool.ruff.lint.per-file-ignores]
# переменные окружения должны быть выставлены до импорта настроек
"backend/*/tests/conftest.py" = ["E402"]
"backend/*/tests/*.py" = ["E402"]

# --- mypy ---------------------------------------------------------------------
# Сервисы проверяются по отдельности (у каждого свои пакеты app/ и config.py),
# поэтому конфиг mypy лежит в backend/<service>/pyproject.toml.
